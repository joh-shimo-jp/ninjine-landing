<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NINJINE — Company Hub</title>
  <meta name="description" content="NINJINE — アイデアを形にするプロダクト群。ESHINE（画像→パーツ→アニメーションSVG）、ご飯だよ！（献立アプリ）を開発しています。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      background: #FAFAF8;
      color: #2A2A2A;
      line-height: 1.75;
      min-height: 100vh;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
      text-align: center;
    }
    h1 { font-size: 1.9rem; letter-spacing: 0.14em; margin-bottom: 0.5rem; }
    .tagline { color: #6A6A6A; font-size: 0.95rem; margin-bottom: 2.5rem; }

    .products {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin: 2rem 0;
    }
    .product-card {
      display: block;
      text-align: left;
      padding: 1.25rem 1.4rem;
      background: #fff;
      border: 1px solid #DDDBD5;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    .product-card:hover { border-color: #4A3728; background: #FBF9F4; }
    .product-name {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .product-name .ext-mark { font-size: 0.7rem; color: #8B7355; font-weight: 400; }
    .product-desc { margin-top: 0.4rem; font-size: 0.88rem; color: #6A6A6A; }

    footer { margin-top: 3rem; font-size: 0.78rem; color: #6A6A6A; }
    footer a { color: #4A3728; }
  </style>
</head>
<body>
  <main>
    <h1>NINJINE</h1>
    <p class="tagline">アイデアを形にするプロダクト群</p>

    <div class="products">
      <a class="product-card" href="https://joh-shimo-jp.github.io/eshine-landing/" target="_blank" rel="noopener">
        <div class="product-name">ESHINE <span class="ext-mark">↗ 外部サイト</span></div>
        <p class="product-desc">画像 → パーツ切り出し → アニメーション付き SVG を生成するコンポーネントエディタ。</p>
      </a>

      <a class="product-card" href="meal/">
        <div class="product-name">ご飯だよ！</div>
        <p class="product-desc">今日の献立を決めるお手伝い。シンプルな献立管理アプリ。</p>
      </a>
    </div>

    <footer>
      <p>© 2026 NINJINE</p>
      <p><a href="https://x.com/NINJINE000" target="_blank" rel="noopener">X @NINJINE000</a></p>
    </footer>
  </main>
</body>
</html>
