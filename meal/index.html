      font-size: 0.9rem;
      border: 1px solid #2A2A2A;
      color: #2A2A2A;
      transition: background 0.15s;
    }
    .btn:hover { background: #F0EDE5; }

    footer { margin-top: 3rem; font-size: 0.78rem; color: #6A6A6A; }
    footer a { color: #4A3728; }
    .back-link { display: inline-block; margin-top: 0.75rem; font-size: 0.8rem; color: #6A6A6A; text-decoration: none; }
